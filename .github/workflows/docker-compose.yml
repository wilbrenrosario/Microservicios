name: Docker MultiImages

on:
  push:
    branches: [ "develop" ]

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults


  build:

    runs-on: ubuntu-latest
    needs: test 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Validnado ruta
        run: ls -la

      - name: Build and Push Productos Image
        uses: docker/build-push-action@v5
        with:
          context: Productos
          file: Productos/Dockerfile
          push: true
          tags: wilbrenrosario/productos:latest

      - name: Build and Push Ordenes Image
        uses: docker/build-push-action@v5
        with:
          context: Ordenes
          file: Ordenes/Dockerfile
          push: true
          tags: wilbrenrosario/ordenes:latest

      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Deploy with Docker Compose
        run: docker-compose up -d
