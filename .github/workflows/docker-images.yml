name: Docker MultiImages

on:
  push:
    branches: [ "develop" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: wilbrenrosario
          password: barbbiE21
          
      - name: Validnado ruta
        run: ls -la

      - name: Build and Push Productos Image
        uses: docker/build-push-action@v5
        with:
          context: productos
          file: productos/Dockerfile
          push: true
          tags: wilbrenrosario/productos:latest

      - name: Build and Push Ordenes Image
        uses: docker/build-push-action@v5
        with:
          context: ../ordenes
          file: ./ordenes/Dockerfile
          push: true
          tags: wilbrenrosario/ordenes:latest

      - name: Deploy with Docker Compose
        run: docker-compose up -d
